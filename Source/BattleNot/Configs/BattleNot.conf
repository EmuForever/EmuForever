###################################################################################################
# BattleNot Server Configuration File #
###################################################################################################

###################################################################################################
# BATTLENOT SERVER SETTINGS
#
#    BattlenetPort
#        Description: TCP port to reach the auth server for battle.net connections.
#        Default:     1119

BattlenetPort = 1119

#
#    LoginREST.Port
#        Description: TCP port to reach the REST login method.
#        Default:     8081
#
#    LoginREST.ExternalAddress
#        Description: Address sent to clients connecting from outside the network where BattleNot runs
#        Default:     "trinity.actual.battle.net"
#
#    LoginREST.LocalAddress
#        Description: Address sent to clients connecting from inside the network where BattleNot runs
#        Default:     "trinity.actual.battle.net"
#
#    LoginREST.TicketDuration
#        Description: Determines how long the login ticket is valid (in seconds)
#                     When using client -launcherlogin feature it is recommended to set it to a high value (like a week)
#        Default:     3600
#

LoginREST.Port = 8081
LoginREST.ExternalAddress = "trinity.actual.battle.net"
LoginREST.LocalAddress = "trinity.actual.battle.net"
LoginREST.TicketDuration = 3600

#
#    BindIP
#        Description: Bind auth server to IP. Also used by the shop (8443) and CRL (8082) listeners.
#        Default:     "127.0.0.1"

BindIP = "127.0.0.1"

#
#    CertificateFile
#    PrivateKeyFile
#        Description: PEM certificate and private key used for the Battle.net TLS, login REST and shop.
#                     Relative paths are resolved from the BattleNot executable directory.
#                     forever.crl is served from the certificate's directory.
#        Example:     "D:/wowforever/ForeverRepack/server/forever.cert.pem"
#        Default:     ""

CertificateFile = "D:/wowforever/ForeverRepack/server/forever.cert.pem"
PrivateKeyFile = "D:/wowforever/ForeverRepack/server/forever.key.pem"

#
#    RealmsStateUpdateDelay
#        Description: Time (in seconds) between realm list updates and expired ban checks.
#        Default:     10

RealmsStateUpdateDelay = 10

#
#    ContentSetID
#        Description: Content set sent to the client in the realm list (Forever 1.60 classic content).
#        Default:     137

ContentSetID = 137

#
#    SuperDistrictID
#        Description: Super district ID sent with the realm join ticket.
#        Default:     2

SuperDistrictID = 2

#
#    WrongPass.MaxCount
#        Description: Number of login attempts with wrong password before the account or IP will be
#                     banned.
#        Default:     0  - (Disabled)
#                     1+ - (Enabled)

WrongPass.MaxCount = 0

#
#    WrongPass.BanTime
#        Description: Time (in seconds) for banning account or IP for invalid login attempts.
#        Default:     600 - (10 minutes)
#                     0   - (Permanent ban)

WrongPass.BanTime = 600

#
###################################################################################################

###################################################################################################
# MYSQL SETTINGS
#
#    LoginDatabaseInfo
#        Description: Database connection settings for the auth database.
#        Example:
#					  LoginDatabaseInfo.Host = hostname
#					  LoginDatabaseInfo.Port = port_number
#					  LoginDatabaseInfo.Username = "username"
#					  LoginDatabaseInfo.Password = "password"
#					  LoginDatabaseInfo.Database = "auth"
#					  LoginDatabaseInfo.SSL = false

LoginDatabaseInfo.Host = "127.0.0.1"
LoginDatabaseInfo.Port = "3306"
LoginDatabaseInfo.Username = "root"
LoginDatabaseInfo.Password = ""
LoginDatabaseInfo.Database = "auth"
LoginDatabaseInfo.SSL = false

#
#    Shop.WorldDatabase
#        Description: Name of the world database (same server as the auth database) the shop reads items from.
#        Default:     "world"

Shop.WorldDatabase = "world"

#
###################################################################################################

###################################################################################################
#
#  LOGGING SYSTEM SETTINGS
#
#    LogsDir
#        Description: Logs directory setting.
#        Important:   LogsDir needs to be quoted, as the string might contain space characters.
#                     Logs directory must exists, or log file creation will be disabled.
#        Default:     "Logs" - (Log files will be stored in the current path)

LogsDir = "Logs"

#
#    Logging.AspNetLevel
#        Description: Minimum level of ASP.NET Core / Kestrel messages forwarded to Logger.Http.
#        Default:     3 - (Warning)
#                     0 - (Trace)
#                     1 - (Debug)
#                     2 - (Information)
#                     4 - (Error)
#                     5 - (Critical)
#                     6 - (None)

Logging.AspNetLevel = 3

#
#  Appender config values: Given an appender "name"
#    Appender.name
#        Description: Defines 'where to log'
#        Format:      Type,LogLevel,Flags,optional1,optional2,optional3
#
#                     Type
#                         0 - (None)
#                         1 - (Console)
#                         2 - (File)
#                         3 - (DB)
#
#                     LogLevel
#                         0 - (Disabled)
#                         1 - (Trace)
#                         2 - (Debug)
#                         3 - (Info)
#                         4 - (Warn)
#                         5 - (Error)
#                         6 - (Fatal)
#
#                     Flags:
#                         0 - None
#                         1 - Prefix Timestamp to the text
#                         2 - Prefix Log Level to the text
#                         4 - Prefix Log Filter type to the text
#
#                     File: Name of the file (read as optional1 if Type = File)
#                         Allows to use one "{0}" to create dynamic files
#

Appender.Console=1,2,0
Appender.BattleNot=2,2,1,BattleNot.log

#  Logger config values: Given a logger "name"
#    Logger.name
#        Description: Defines 'What to log'
#        Format:      LogLevel,AppenderList
#
#                     LogLevel
#                         0 - (Disabled)
#                         1 - (Trace)
#                         2 - (Debug)
#                         3 - (Info)
#                         4 - (Warn)
#                         5 - (Error)
#                         6 - (Fatal)
#
#                     AppenderList: List of appenders linked to logger
#                     (Using spaces as separator).
#
#        Server  - startup, header, realm refresh
#        Network - Battle.net RPC sessions
#        Session - Battle.net friends
#        Http    - login REST, shop, support, social, ASP.NET Core
#        Sql     - auth database and schema

Logger.Server=3,Console BattleNot
Logger.Network=3,Console BattleNot
Logger.Session=3,Console BattleNot
Logger.Http=3,Console BattleNot
Logger.Sql=3,Console BattleNot

#
###################################################################################################
